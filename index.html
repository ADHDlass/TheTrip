  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el || el.disabled) return;
    var a = el.getAttribute('data-action'), d = el.dataset;
    switch (a) {
      case 'sync-retry':
        render();
        doSync();
        break;
      case 'ob-back': ui.obStep--; ui.err = ''; render(); break;
      case 'ob-import': go({ name: 'import', text: '', error: null, plan: null, choice: 'keep', stage: 'review', written: 0 }); break;
      case 'ob-start-prev': ui.obStart = L.addDays(ui.obStart, -1); render(); break;
      case 'ob-start-next': if (ui.obStart < today()) ui.obStart = L.addDays(ui.obStart, 1); render(); break;
      case 'ob-next':
        if (ui.obStep === 1 && !ui.obName.trim()) { ui.err = 'Enter the name of your medication.'; render(); break; }
        if (ui.obStep === 2 && !parseDose(ui.obDose)) { ui.err = 'Enter your dose in mg, for example 10.'; render(); break; }
        if (ui.obStep === 3) { settings = { onboarded: true, medications: [{ id: newId(), name: ui.obName.trim(), doseMg: parseDose(ui.obDose), startDate: ui.obStart }] }; saveSettings(); go({ name: 'tabs', tab: 'home' }); break; }
        ui.obStep++; ui.err = ''; render(); break;
      case 'toast-close': ui.toast = ''; var tn = document.getElementById('toast'); if (tn) tn.remove(); break;
      case 'tab': ui.toast = ''; ui.rmQl = null; ui.backTab = null; view = { name: 'tabs', tab: d.tab }; ui.setMode = 'list'; render(true); break;
      case 'reload-app': try { location.reload(); } catch (x) { ui.toast = 'Close the app and open it again to update.'; render(true); } break;
      case 'goto-day': ui.day = d.date; render(true); break;
      case 'day-prev': ui.day = L.addDays(ui.day, -1); render(); break;
      case 'day-next': if (ui.day < today()) ui.day = L.addDays(ui.day, 1); render(); break;
      case 'open-day': if (d.from) ui.backTab = d.from; openDay(d.date); break;
      case 'cal-day': if (entries[d.date]) { ui.backTab = 'history'; ui.calSel = d.date; openDay(d.date); } else { ui.calSel = d.date; render(); } break;
      case 'cal-prev': calSync(ui.calIdx - 1, true); break;
      case 'cal-next': calSync(ui.calIdx + 1, true); break;
      case 'y-part': var yn = Number(d.part), ye2 = entries[d.date];
        if (ye2 && partDone(ye2, yn)) { ui.backTab = 'home'; go({ name: 'summary', date: d.date, part: yn }); }
        else if (partAvailable(d.date, yn)) { ui.yAsk = { date: d.date, part: yn }; render(true); }
        else { ui.backTab = 'home'; openDay(d.date); }
        break;
      case 'start-part': startPart(d.date, Number(d.part)); break;
      case 'same': ui.backTab = 'home'; startSame(d.date, Number(d.part)); break;
      case 'same-back': var se = entries[view.date], sr = ui.sameRestore; if (sr && sr.date === view.date) { if (sr.none) dropEntry(view.date); else putEntry(sr); } ui.sameRestore = null; var sbt = ui.backTab || 'home'; ui.backTab = null; go({ name: 'tabs', tab: sbt }); break;
      case 'same-edit': go({ name: 'wizard', date: view.date, index: Number(d.i), edit: true, ret: 'same', retPart: view.part }); break;
      case 'same-save': var ss = entries[view.date], sp = view.part; putEntry(withParts(Object.assign({}, ss, { step: PARTS[sp].to }), sp)); ui.sameRestore = null; ui.toast = PARTS[sp].done + '.'; ui.day = today(); ui.backTab = null; go({ name: 'tabs', tab: 'home' }); break;
      case 'same-scratch': var sr2 = ui.sameRestore, sp2 = view.part; if (sr2 && sr2.date === view.date) { if (sr2.none) dropEntry(view.date); else putEntry(sr2); } ui.sameRestore = null; startPart(view.date, sp2); break;
      case 'ql-open': ui.toast = ''; ui.ql = { when: 'now', time: '', sel: {}, moreD: false, moreH: false, note: '', noteOpen: false, err: '' }; render(); break;
      case 'ql-close': ui.ql = null; render(); break;
      case 'ql-when': ui.ql.when = d.w; if (d.w === 'earlier' && !ui.ql.time) ui.ql.time = hhmm(); ui.ql.err = ''; render(); break;
      case 'ql-toggle': if (ui.ql.sel[d.k]) delete ui.ql.sel[d.k]; else ui.ql.sel[d.k] = 1; ui.ql.err = ''; render(); break;
      case 'ql-more': if (d.w === 'D') ui.ql.moreD = true; else ui.ql.moreH = true; render(); break;
      case 'ql-note': ui.ql.noteOpen = true; render(); var qn = document.getElementById('ql-note'); if (qn) qn.focus(); break;
      case 'ql-save':
        var items = Object.keys(ui.ql.sel).map(function (k) { var pr = k.split('.'); return { q: pr[0], o: pr[1] }; }), tm = ui.ql.when === 'now' ? hhmm() : ui.ql.time;
        if (!items.length) { ui.ql.err = 'Choose at least one thing to log.'; render(); break; }
        if (!L.isValidTime(tm)) { ui.ql.err = 'Enter the time like 14:30.'; render(); break; }
        putQuickLog({ id: newId(), date: today(), time: tm, items: items, note: ui.ql.note.trim() || undefined, createdAt: now() });
        ui.ql = null; ui.toast = 'Logged at ' + tm + '.'; ui.day = ui.day; render(); break;
      case 'ql-rm': ui.rmQl = d.id; render(); break;
      case 'ql-rm-yes': removeQuickLog(d.id); ui.rmQl = null; render(); break;
      case 'ov': ui.ovDays = Number(d.days); render(); break;
      // wizard
      case 'toggle': var q = L.QUESTIONS[view.index], e = entries[view.date], ans = e.answers[q.id] || { selected: [] };
        setAnswer({ selected: L.toggleOption(q, ans.selected, d.o), skipped: false, note: ans.note }); render(); break;
      case 'food': var wf = entries[view.date].details.withFood, want = d.v === 'yes'; setDetails({ withFood: wf === want ? undefined : want }); render(); break;
      case 'strongest': setDetails({ strongest: entries[view.date].details.strongest === d.v ? undefined : d.v }); render(); break;
      case 'note-open': view.noteOpen = true; render(); var n = document.getElementById('w-note'); if (n) n.focus(); break;
      case 'w-next': case 'w-skip': advance(); break;
      case 'w-back': wizBack(); break;
      // summary
      case 'sum-edit': go({ name: 'wizard', date: view.date, index: Number(d.i), edit: true, sumPart: view.part }); break;
      case 'dlg-close': dlgClose(); break;
      case 'y-same': var ya2 = ui.yAsk; ui.yAsk = null; startSame(ya2.date, ya2.part); break;
      case 'y-answer': var ya3 = ui.yAsk; ui.yAsk = null; startPart(ya3.date, ya3.part); break;
      case 'reset-part': ui.resetPart = Number(d.p); render(true); break;
      case 'part-reset-yes': var rpn = ui.resetPart; ui.resetPart = 0; resetPart(view.date, rpn); break;
      case 'sum-done': ui.resetPart = 0; var bt = ui.backTab || 'home'; ui.backTab = null; go({ name: 'tabs', tab: bt }); break;
      // settings
      case 'set-dose': ui.setMode = 'dose'; ui.fDose = ''; ui.fStart = today(); ui.err = ''; render(true); break;
      case 'set-new': ui.setMode = 'new'; ui.fName = ''; ui.fDose = ''; ui.fStart = today(); ui.err = ''; render(true); break;
      case 'set-cancel': ui.setMode = 'list'; ui.err = ''; render(true); break;
      case 'set-wipe': ui.setMode = 'wipe'; render(true); break;
      case 'f-start-prev': ui.fStart = L.addDays(ui.fStart, -1); render(); break;
      case 'f-start-next': if (ui.fStart < today()) ui.fStart = L.addDays(ui.fStart, 1); render(); break;
      case 'save-dose': case 'save-new':
        var cur = currentMed(), dose = parseDose(ui.fDose);
        if (a === 'save-new' && !ui.fName.trim()) { ui.err = 'Enter the name of the medication.'; render(); break; }
        if (!dose) { ui.err = 'Enter the dose in mg, for example 10.'; render(); break; }
        if (cur && ui.fStart <= cur.startDate) { ui.err = 'Pick a day after ' + L.formatLong(cur.startDate) + '.'; render(); break; }
        var nm = { id: newId(), name: a === 'save-dose' ? cur.name : ui.fName.trim(), doseMg: dose, startDate: ui.fStart };
        settings.medications = (settings.medications || []).map(function (m) { return cur && m.id === cur.id ? Object.assign({}, m, { endDate: L.addDays(nm.startDate, -1) }) : m; }).concat([nm]);
        saveSettings(); ui.setMode = 'list'; ui.err = ''; render(true); break;
      case 'wipe-confirm':
        wipeAllData();
        break;
      case 'export-json': doExport('json'); break;
      case 'export-csv': doExport('csv'); break;
      case 'report': go({ name: 'report', msg: '', msgOk: false }); break;
      case 'rep-close': go({ name: 'tabs', tab: 'settings' }); break;
      case 'rep-save': var rr = buildReport(); if (rr && downloads) { var rb; try { rb = pdfBytes(rr); } catch (x) { view.msg = 'Could not build the PDF.'; view.msgOk = false; render(true); break; } downloads.save({ filename: 'med-diary-doctor-summary-' + today() + '.pdf', data: rb }).then(function () { ui.toast = 'PDF saved.'; render(true); }, function (err) { view.msg = err && err.code === 'declined' ? 'Not saved.' : 'Saving a file is not available here.'; view.msgOk = false; render(true); }); } break;
      case 'rep-copy': var rt = buildReport(); if (rt) { var txt = reportText(rt); (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { ui.toast = 'Copied.'; render(true); }, function () { view.msg = 'Copying is not available here.'; view.msgOk = false; render(true); }); } break;
      case 'import': go({ name: 'import', text: '', error: null, plan: null, choice: 'keep', stage: 'review', written: 0 }); break;
      // export screen
      case 'exp-close': go({ name: 'tabs', tab: 'settings' }); break;
      case 'exp-save': if (downloads) {
          var fname = view.kind === 'csv' ? 'med-diary-' + today() + '.csv' : 'med-diary-backup-' + today() + '.json';
          downloads.save({ filename: fname, data: view.text }).then(function () { if (view.kind === 'json') { meta.lastExportAt = now(); saveMeta(); } ui.toast = 'File saved.'; render(); }, function (err) { view.msg = err && err.code === 'declined' ? 'Not saved.' : 'Saving a file is not available here. Use Copy text instead.'; view.msgOk = false; render(); });
        } break;
      case 'exp-copy':
        var ta = document.getElementById('exp-text'), text = view.text;
        var done = function (ok) { if (ok && view.kind === 'json') { meta.lastExportAt = now(); saveMeta(); } if (ok) { view.msg = ''; ui.toast = 'Copied. Paste it into Notes or an email to yourself.'; } else { view.msg = 'Copying was blocked. Tap the text, select all, and copy it by hand.'; view.msgOk = false; } render(); if (!ok) { var t2 = document.getElementById('exp-text'); if (t2) { t2.focus(); t2.select(); } } };
        var fallback = function () { var ok = false; try { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand('copy'); } catch (x) { } done(ok); };
        try { navigator.clipboard.writeText(text).then(function () { done(true); }, fallback); } catch (x) { fallback(); } break;
      // import screen
      case 'imp-close': view.stage = 'review'; var from = settings.onboarded ? { name: 'tabs', tab: 'settings' } : { name: 'onboarding' }; go(from); break;
      case 'imp-check': var r = L.parseBackup(view.text);
        if (!r.ok) { view.error = r.error; view.plan = null; } else { view.error = null; view.choice = 'keep'; view.plan = L.planImport(r, entryList(), settings.medications || [], allQuickLogs()); }
        render(); break;
      case 'imp-choice': view.choice = d.c; render(); break;
      case 'imp-run': if (view.choice === 'replace' && view.plan.conflicts.length) { view.stage = 'confirm'; render(true); } else impWrite(); break;
      case 'imp-write': impWrite(); break;
      case 'imp-back': view.stage = 'review'; render(true); break;
      case 'imp-done': ui.day = today(); go(settings.onboarded ? { name: 'tabs', tab: 'home' } : { name: 'onboarding' }); break;
    }
  });
  /** Delete one part's answers only; the other parts stay. */
  function resetPart(date, n) {
    var e = entries[date]; if (!e) { render(true); return; }
    var ps = [1, 2, 3].filter(function (k) { return k !== n && partDone(e, k); }), o = JSON.parse(JSON.stringify(e)), P = PARTS[n];
    L.QUESTIONS.slice(P.from, P.to + 1).forEach(function (q) { delete o.answers[q.id]; });
    var any = Object.keys(o.answers).length > 0;
    ui.toast = P.short + ' was reset.';
    if (!any && !ps.length) { dropEntry(date); ui.day = today(); var bt2 = ui.backTab || 'home'; ui.backTab = null; go({ name: 'tabs', tab: bt2 }); return; }
    o.parts = ps; o.status = ps.length === 3 ? 'complete' : (ps.indexOf(1) >= 0 && ps.indexOf(2) >= 0) ? 'awaiting' : 'in_progress'; o.step = Math.min(o.step || 0, P.from); o.updatedAt = now();
    if (o.status !== 'complete') delete o.completedAt;
    if (!any) delete o.copiedFrom;
    putEntry(o);
    if (view.part) { ui.day = today(); var bt3 = ui.backTab || 'home'; ui.backTab = null; go({ name: 'tabs', tab: bt3 }); return; }
    render(true);
  }
  function dlgClose() {
    if (ui.yAsk) ui.yAsk = null; else if (ui.resetPart) ui.resetPart = 0; else if (ui.rmQl) ui.rmQl = null; else if (ui.setMode === 'wipe') ui.setMode = 'list';
    else if (view.name === 'import' && view.stage === 'confirm') view.stage = 'review';
    else if (view.name === 'import' && view.stage === 'done') { ui.day = today(); go(settings.onboarded ? { name: 'tabs', tab: 'home' } : { name: 'onboarding' }); return; }
    render(true);
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && currentDlg()) dlgClose(); });
  function impWrite() {
    var res = L.applyPlan(view.plan, view.choice);
    res.entries.forEach(putEntry); res.quickLogs.forEach(putQuickLog);
    settings.medications = (settings.medications || []).concat(res.medications);
    settings.onboarded = settings.onboarded || settings.medications.length > 0;
    saveSettings();
    view.written = res.entries.length; view.stage = 'done'; render(true);
  }
  var calTimer = null;
  app.addEventListener('scroll', function (ev) {
    var c = ev.target; if (!c || c.id !== 'cal') return;
    clearTimeout(calTimer);
    calTimer = setTimeout(function () { if (!c.isConnected || c !== document.getElementById('cal')) return; var w = c.clientWidth || 1, idx = Math.round(c.scrollLeft / w); if (idx !== ui.calIdx) calSync(idx, false); }, 80);
  }, true);
  app.addEventListener('input', function (ev) {
    var t = ev.target, b = t.getAttribute && t.getAttribute('data-bind'); if (!b) return;
    if (b === 'ob-name') ui.obName = t.value;
    else if (b === 'ob-dose') ui.obDose = t.value;
    else if (b === 'f-name') ui.fName = t.value;
    else if (b === 'f-dose') ui.fDose = t.value;
    else if (b === 'ql-note') ui.ql.note = t.value;
    else if (b === 'ql-time') ui.ql.time = t.value;
    else if (b === 'imp-text') { view.text = t.value; view.plan = null; view.error = null; }
    else if (b === 'w-dose') { view.doseText = t.value; setDetails({ doseMg: parseDose(t.value) }); }
    else if (b === 'w-time') {
      var digits = t.value.replace(/\D/g, '').slice(0, 4), f = digits.length > 2 ? digits.slice(0, 2) + ':' + digits.slice(2) : digits;
      t.value = f; view.timeText = f; setDetails({ takenTime: L.isValidTime(f) ? f : undefined });
      var hint = document.getElementById('w-time-hint'); if (hint) hint.textContent = f.length > 0 && !L.isValidTime(f) ? 'Use 24-hour time, like 08:30.' : 'For example 08:30';
    }
    else if (b === 'w-note') { var q = L.QUESTIONS[view.index], e = entries[view.date], ans = e.answers[q.id] || { selected: [] }; setAnswer({ selected: ans.selected, note: t.value, skipped: false }); }
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'imp-file' && t.files && t.files[0]) {
      var rd = new FileReader();
      rd.onload = function () { view.text = String(rd.result || ''); view.plan = null; view.error = null; render(); };
      rd.onerror = function () { view.error = 'That file could not be read.'; render(); };
      rd.readAsText(t.files[0]);
    }
  });

  render(true);
})();
</script>
